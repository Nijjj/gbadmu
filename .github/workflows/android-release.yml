name: Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-apk
  cancel-in-progress: false

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.1.12297006
            cmake;3.22.1

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Locate release APK
        run: |
          set -eu
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "${APK_PATH:-}" ]; then
            echo "No release APK found under app/build/outputs/apk/release" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK_PATH" dist/y2kboy-release.apk
          echo "APK_PATH=$APK_PATH"
          ls -lah dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Y2KBoy latest
          files: dist/y2kboy-release.apk
          overwrite_files: true
          generate_release_notes: false
          make_latest: true
