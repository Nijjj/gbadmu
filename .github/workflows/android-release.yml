name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.1.12297006
            cmake;3.22.1

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease

      - name: List release outputs
        run: find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Stage release APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/y2kboy-release.apk
          ls -lah dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Y2KBoy latest
          files: dist/y2kboy-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: true
